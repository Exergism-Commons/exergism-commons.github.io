name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Validate static site
        run: python scripts/validate_site.py
