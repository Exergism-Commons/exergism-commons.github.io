<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not found — Exergism Commons</title>
  <link rel="icon" href="/assets/brand/commons-symbol.webp" type="image/webp">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/brand.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 40px 0; }
    .not-found-inner { max-width: 820px; }
    .not-found-logo { width: 78px; height: 78px; object-fit: contain; border-radius: 50%; background: #fff; margin-bottom: 30px; }
    .not-found h1 { margin-bottom: 28px; }
    .not-found p { max-width: 650px; color: var(--muted); font-size: 1.08rem; }
    .not-found .button { margin-top: 18px; width: fit-content; }
  </style>
</head>
<body>
  <main class="not-found shell">
    <div class="not-found-inner">
      <img class="not-found-logo" src="/assets/brand/commons-symbol.webp" width="78" height="78" alt="Exergism Commons symbol">
      <p class="eyebrow">404 · unresolved path</p>
      <h1>Nothing is published here.</h1>
      <p>The requested public-web path does not exist. Persistent semantic identifiers are served separately from <strong>id.exergism.org</strong>.</p>
      <a class="button button-primary" href="/">Return to Exergism Commons</a>
    </div>
  </main>
</body>
</html>
