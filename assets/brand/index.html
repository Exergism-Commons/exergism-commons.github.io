<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0c">
  <title>Exergism Commons brand assets</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; background: #f2f0e9; color: #111512; }
    main { max-width: 900px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 24px; border: 1px solid #cfd2ca; border-radius: 18px; background: #fff; }
    img { display: block; width: 100%; height: 240px; object-fit: contain; }
    figcaption { margin-top: 16px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Exergism Commons brand assets</h1>
    <p>Presentation assets used by the public website.</p>
    <div class="grid">
      <figure><img src="./commons-symbol.webp" alt="Exergism Commons symbol"><figcaption>Commons symbol</figcaption></figure>
      <figure><img src="./exergism-symbol.webp" alt="Exergism symbol"><figcaption>Exergism symbol</figcaption></figure>
      <figure><img src="./commons-crest.webp" alt="Exergism Commons crest"><figcaption>Commons crest</figcaption></figure>
    </div>
  </main>
</body>
</html>
